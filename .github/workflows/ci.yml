name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod download
      - run: go vet ./...
      - run: go build -trimpath ./cmd/mihomori
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: verify dev/private narHash is up to date
        run: |
          set -euo pipefail
          expected=$(cat dev/private.narHash)
          actual=$(nix hash path ./dev/private | tr -d '\n')
          if [ "$expected" != "$actual" ]; then
            echo "dev/private.narHash is stale: expected $expected, got $actual"
            echo "run 'nix run .#update-dev-private-narHash' from the repository root and commit the result"
            exit 1
          fi
      - run: nix flake check --print-build-logs
